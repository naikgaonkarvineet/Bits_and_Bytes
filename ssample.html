<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap');

  :root {
    --ink: #101820;
    --card: #17212C;
    --text: #EDEEEF;
    --muted: #8A94A6;
    --accent: #5EC8B8;
    --border: #2A3542;
    --error: #E88A7D;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--ink);
    font-family: 'Inter', sans-serif;
    color: var(--text);
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px 32px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 28px;
    margin: 0 0 6px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 28px;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 6px;
    color: var(--muted);
  }

  input {
    width: 100%;
    padding: 11px 12px;
    background: var(--ink);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    transition: border-color 0.15s ease;
  }

  input:focus {
    outline: none;
    border-color: var(--accent);
  }

  input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .row-between {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
  }

  .remember {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
  }

  .remember input {
    width: auto;
    accent-color: var(--accent);
  }

  a.link {
    color: var(--accent);
    text-decoration: none;
    font-size: 13px;
  }

  a.link:hover { text-decoration: underline; }

  button {
    margin-top: 6px;
    padding: 12px;
    border: none;
    border-radius: 7px;
    background: var(--accent);
    color: #0B1116;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  button:hover { opacity: 0.9; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .error {
    display: none;
    font-size: 13px;
    color: var(--error);
    margin-top: -8px;
  }

  .footer-text {
    margin-top: 24px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

  <div class="card">
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to continue to your account.</p>

    <form id="loginForm">
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>

      <div>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
      </div>

      <p class="error" id="errorMsg">Enter a valid email and password.</p>

      <div class="row-between">
        <label class="remember">
          <input type="checkbox" id="remember" name="remember">
          Remember me
        </label>
        <a href="#" class="link">Forgot password?</a>
      </div>

      <button type="submit">Sign in</button>
    </form>

    <p class="footer-text">Don't have an account? <a href="#" class="link">Create one</a></p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      if (!email || !password) {
        errorMsg.style.display = 'block';
        return;
      }

      errorMsg.style.display = 'none';
      // Replace this with your actual authentication logic.
      alert('Signed in as ' + email);
    });
  </script>

</body>
</html>
